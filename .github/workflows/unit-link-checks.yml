name: Unit account link checks
on:
  pull_request:
    paths:
      - 'html/script/unit*.php'
      - 'html/gatekeeper/google*.php'
      - 'html/script/appServices.php'
      - 'html/script/serviceDiscoveryCommon.php'
      - 'misc/services.example.php'
      - 'misc/test_service_discovery.php'
      - 'misc/unit*'
      - 'misc/setup_unit_link.sh'
      - 'misc/test_unit_link.php'
      - '.github/workflows/unit-link-checks.yml'
  push:
    branches: [main]
    paths:
      - 'html/script/unit*.php'
      - 'html/gatekeeper/google*.php'
      - 'html/script/appServices.php'
      - 'html/script/serviceDiscoveryCommon.php'
      - 'misc/services.example.php'
      - 'misc/test_service_discovery.php'
      - '.github/workflows/unit-link-checks.yml'
jobs:
  identity-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and identity boundary tests
        run: |
          for file in html/script/unit*.php misc/unit-link.example.php html/script/appServices.php html/script/serviceDiscoveryCommon.php misc/services.example.php html/gatekeeper/google*.php; do php -l "$file"; done
          php -n misc/test_unit_link.php
          php -n misc/test_service_discovery.php
          bash -n misc/setup_unit_link.sh
