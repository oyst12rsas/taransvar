name: Operations agent pilot checks
on:
  pull_request:
    paths:
      - 'html/script/operationsActivity.php'
      - 'html/gatekeeper/func/operationsStatusView.php'
      - 'tests/operations_status_view_test.php'
      - 'misc/operations_deployment.py'
      - 'tests/operations_deployment_test.py'
      - 'misc/operations_policy.py'
      - 'tests/operations_policy_test.py'
      - 'misc/operations_tools.py'
      - 'misc/operations_reboot.py'
      - 'misc/operations_collectors.py'
      - 'misc/configure_operations_activity.sh'
      - 'misc/configure_operations_local_activity.sh'
      - 'tests/operations_session_fallback_test.py'
      - 'tests/operations_reboot_test.py'
      - 'misc/operations_schedule.py'
      - 'misc/operations_reporting.py'
      - 'misc/operations_agent.py'
      - 'misc/operations_activity.py'
      - 'misc/operations_observer.py'
      - 'tests/operations_observer_test.py'
      - 'misc/operations_diagnostics.py'
      - 'misc/operations_actions.py'
      - 'misc/operations_prompt.py'
      - 'misc/operations_model_probe.py'
      - 'misc/operations-activity.json.example'
      - 'misc/install_operations_agent.sh'
      - 'misc/operations-agent.json.example'
      - 'tests/operations_agent_test.py'
      - 'tests/operations_activity_test.py'
      - 'tests/operations_diagnostics_test.py'
      - 'tests/operations_actions_test.py'
      - 'tests/operations_prompt_test.py'
      - 'docs/AI_OPERATIONS_MANUAL.md'
      - '.github/workflows/operations-agent-checks.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'operations*_test.py'
      - run: python3 -m py_compile misc/operations_policy.py misc/operations_reboot.py misc/operations_agent.py misc/operations_activity.py misc/operations_diagnostics.py misc/operations_actions.py misc/operations_prompt.py misc/operations_model_probe.py
      - run: python3 -m json.tool misc/operations-agent.json.example >/dev/null
      - run: bash -n misc/install_operations_agent.sh misc/configure_operations_activity.sh misc/configure_operations_local_activity.sh
      - run: php tests/operations_status_view_test.php
      - run: php -l html/script/operationsActivity.php && php -l html/gatekeeper/func/operationsStatusView.php
