name: Build taralink

on:
  pull_request:
    paths:
      - 'taralink/**'
      - 'tarakernel/module_globals.h'
      - '.github/workflows/taralink-build.yml'
  push:
    branches: [main]
    paths:
      - 'taralink/**'
      - 'tarakernel/module_globals.h'
      - '.github/workflows/taralink-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev libcurl4-openssl-dev libcjson-dev
      - name: Build taralink
        run: |
          cd taralink
          gcc -g taralink.c -o taralink $(mariadb_config --cflags --libs) -lcurl -lcjson
