name: Demo 4 PHP syntax
on:
  pull_request:
    paths:
      - 'html/script/appDemo4Gateway.php'
      - 'html/script/appDemo4Session.php'
      - '.github/workflows/demo4-php-lint.yml'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l html/script/appDemo4Gateway.php && php -l html/script/appDemo4Session.php
