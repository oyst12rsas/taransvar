name: Installation secret enrollment
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'hotspot/distro/install.sh'
      - 'misc/install_agent_approvals.sh'
      - 'misc/install_netbird_management.sh'
      - 'misc/enroll_google_manager.py'
      - 'misc/test_enroll_google_manager.py'
      - 'tests/install_secret_preflight_test.py'
      - '.github/workflows/install-secret.yml'
jobs:
  enrollment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh hotspot/distro/install.sh misc/install_agent_approvals.sh misc/install_netbird_management.sh
      - run: python3 -m unittest discover -s tests -p install_secret_preflight_test.py
      - run: sudo env PYTHONPATH=misc python3 -m unittest misc/test_enroll_google_manager.py misc/test_enroll_gatekeeper_google.py
