# Taransvar IPsec peer configuration for ipsec VM
# Save as /root/taransvar/vpn.conf on the ipsec VM

ROLE=peer

PEER_NAME=torsas_ipsec
PEER_ID=torsas_ipsec
PEER_VPN_IP=10.47.199.1

VPS_PUBLIC_IP=81.88.19.252
VPS_ID=81.88.19.252

PSK=PUT_SAME_LONG_SECRET_AS_ON_VPS_HERE

# This endpoint itself, no routed child subnet yet:
LOCAL_SUBNET=10.47.199.1/32

# Start narrow. Use 10.0.0.0/8 later if you want whole overlay access.
REMOTE_SUBNET=10.47.0.1/32

ENABLE_FORWARDING=no
APPLY_FIREWALL=no
INITIATE_TUNNEL=yes
